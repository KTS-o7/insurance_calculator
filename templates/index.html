<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="app-container">
    <header>
      <div class="logo">
        <span class="icon">🛡️</span>
        <h1>Smart Wealth</h1>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Dark Mode">
        <svg class="sun-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
          fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
          fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <main>
      <div class="hero-section">
        <h2>Plan Your Future</h2>
        <p>Advanced financial analysis for the modern investor.</p>
      </div>

      {% if error %}
      <div class="error-banner">
        {{ error }}
      </div>
      {% endif %}

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('comparison')">Policy Comparison</button>
        <button class="tab-btn" onclick="switchTab('goal')">Goal Planner</button>
      </div>

      <!-- COMPARISON FORM -->
      <form method="POST" class="calculator-form" id="comparison-form">
        <input type="hidden" name="form_type" value="comparison">

        <div class="form-grid">
          <div class="form-group">
            <label for="age">Current Age</label>
            <input type="number" name="age" required min="18" max="65" placeholder="e.g., 30">
          </div>

          <div class="form-group">
            <label for="gender">Gender</label>
            <select name="gender" required>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div class="form-group">
            <label for="premium">Annual Premium (₹)</label>
            <input type="number" name="premium" required min="1000" placeholder="e.g., 50000">
          </div>

          <div class="form-group">
            <label for="maturity">Maturity Benefit (₹)</label>
            <input type="number" name="maturity" required min="1000" placeholder="Total payout at end">
          </div>

          <div class="form-group">
            <label for="premium_term">Premium Paying Term (Years)</label>
            <input type="number" name="premium_term" required min="5" max="40" placeholder="e.g., 10">
          </div>

          <div class="form-group">
            <label for="total_term">Total Policy Term (Years)</label>
            <input type="number" name="total_term" required min="5" max="50" placeholder="e.g., 20">
          </div>

          <div class="form-group full-width">
            <label for="return_rate">Expected Investment Return (%) <span id="return_val">10%</span></label>
            <input type="range" name="return_rate" min="4" max="18" step="0.5" value="10"
              oninput="document.getElementById('return_val').innerText = this.value + '%'">
            <div class="range-labels">
              <span>Conservative (4%)</span>
              <span>Aggressive (18%)</span>
            </div>
          </div>

          <div class="form-group">
            <label for="tax_bracket">Income Tax Bracket (%)</label>
            <input type="number" name="tax_bracket" value="30.0" step="0.5" min="0" max="100">
          </div>

          <div class="form-group">
            <label for="capital_gains_tax">Capital Gains Tax (%)</label>
            <input type="number" name="capital_gains_tax" value="12.5" step="0.5" min="0" max="100">
          </div>

          <div class="form-group">
            <label for="inflation_rate">Inflation Rate (%)</label>
            <input type="number" name="inflation_rate" value="6.0" step="0.1">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Calculate Comparison</button>
        </div>
      </form>

      <!-- GOAL PLANNING FORM (Hidden by default) -->
      <form method="POST" class="calculator-form" id="goal-form" style="display: none;">
        <input type="hidden" name="form_type" value="goal_planning">

        <div class="form-grid">
          <div class="form-group full-width">
            <label>Target Corpus Amount (₹)</label>
            <input type="number" name="target_amount" required min="100000" placeholder="e.g., 10000000 (1 Crore)">
          </div>

          <div class="form-group">
            <label>Time to Goal (Years)</label>
            <input type="number" name="goal_years" required min="1" max="50" placeholder="e.g., 20">
          </div>

          <div class="form-group">
            <label>Expected Return (%)</label>
            <input type="number" name="goal_return_rate" value="12" step="0.5">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Plan My Goal</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'comparison') {
        document.getElementById('comparison-form').style.display = 'block';
        document.getElementById('goal-form').style.display = 'none';
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
      } else {
        document.getElementById('comparison-form').style.display = 'none';
        document.getElementById('goal-form').style.display = 'block';
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
      }
    }

    const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', saved);
  </script>
</body>

</html>
